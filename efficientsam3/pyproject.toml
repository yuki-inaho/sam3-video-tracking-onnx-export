[project]
name = "efficientsam3-onnx-cpu"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.7.0",
  "torchvision==0.22.0",
  "onnx>=1.19,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript",
  "numpy>=1.26,<3",
  "pillow",
  "timm>=1.0.17",
  "einops",
  "ftfy==6.1.1",
  "regex",
  "iopath",
  "huggingface-hub",
  "pycocotools",
  "psutil",
  "opencv-python-headless",
  "pytest",
  "ruff",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
